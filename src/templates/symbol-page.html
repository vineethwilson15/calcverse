{{HEAD}}
<body>
{{HEADER}}
<main class="container tool-page">
  {{BREADCRUMB_HTML}}

  <section class="tool-hero">
    <h1>{{SYMBOL_CATEGORY}}</h1>
    <p class="tool-subtitle">{{SYMBOL_DESCRIPTION}}</p>
  </section>

  <section class="tool-workspace">
    <p class="symbol-instruction">Click any symbol to copy it to your clipboard</p>
    <label class="input-label" for="symbol-search">Search this collection</label>
    <input id="symbol-search" class="text-input symbol-search" type="search" placeholder="Search by symbol name or Unicode code..." autocomplete="off">
    {{SYMBOLS_GRID}}
    <div class="toast" id="copy-toast">Copied!</div>
  </section>

  <section class="tool-content symbol-reference-content">
    {{SYMBOL_REFERENCE}}
  </section>

  {{AD_SLOT}}

  <section class="tool-content">
    <h2>About {{SYMBOL_CATEGORY}}</h2>
    <p>{{SYMBOL_CONTENT}}</p>
  </section>

  {{FAQ_SECTION}}
  {{RELATED}}
</main>
{{FOOTER}}
<script src="/js/copy-utils.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
